{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">회원가입</h3>
<form method="post" action="{{ url_for('auth.register_post') }}" class="vstack gap-3">
    <input class="form-control" type="text" name="username" placeholder="사용자명" required>
    <input class="form-control" type="email" name="email" placeholder="이메일" required>
    <input class="form-control" type="password" name="password" placeholder="비밀번호" required>
    <button class="btn btn-primary">가입하기</button>
</form>
{% endblock %}
