{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">로그인</h3>
<form method="post" action="{{ url_for('auth.login_post') }}" class="vstack gap-3">
    <input class="form-control" type="text" name="email_or_username" placeholder="이메일 또는 사용자명" required>
    <input class="form-control" type="password" name="password" placeholder="비밀번호" required>
    <button class="btn btn-primary">로그인</button>
</form>
{% endblock %}
